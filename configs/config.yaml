# Every setting for the project lives in this one file.
# Code must read values from here and never hard-code them.

seed: 42                  # the one random seed, used everywhere

paths:                    # all relative to the repo root
  data_dir: data          # downloaded and generated data (not in git)
  results_dir: results    # result tables and plots

dataset:
  name: fiqa              # FiQA from the BEIR benchmark
  split: test             # test questions are used for all experiments
  url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/fiqa.zip
  md5: 17918ed23cd04fb15047f73e6c3bd9d9   # checksum published by BEIR

data_check:
  n_samples: 15           # question and passage pairs to read by eye
  max_chars: 800          # longer passages are cut off in the samples file

retrieval:
  k: 5                    # top 5 passages go into the prompt

organization:
  n_departments: 20       # k-means clusters used as departments
  kmeans_n_init: 10
  kmeans_max_iter: 300
  kmeans_tol: 0.0001
  n_threads: 4            # limit clustering CPU threads
  departments_per_role:
    low: 1
    medium: 4
    high: 16
  users_per_home:
    low: 1
    medium: 2            # second user also gets one outside department role
    high: 2

reference:
  n_threads: 4            # exact FAISS search uses CPU; embeddings are reused

embedding:
  model: sentence-transformers/all-mpnet-base-v2   # changing this means re-running Step 2 onwards
  batch_size: 32          # passages embedded at a time; lower it if memory runs short
  query_prefix: ""        # text put in front of every question; some models (for example bge) need one
  test_n: 1000            # passages used by the quick timing test (python -m src.embed --test)

embedding_check:
  ks: [5, 10]             # baseline is reported for the top 5 and the top 10
